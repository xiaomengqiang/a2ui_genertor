(function () {
  const { useState, useEffect, createContext, useContext } = React;
  const { ConfigProvider, theme } = antd;
// Layer 1: 全局状态 — dark 模式双轨同步(antd algorithm + .dark class)
const AppContext = createContext(null);

function AppProvider({ children }) {
  const [isDark, setIsDark] = useState(false);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", isDark);
  }, [isDark]);

  const value = {
    isDark,
    toggleDark: () => setIsDark((d) => !d),
  };

  return (
    <AppContext.Provider value={value}>
      <ConfigProvider theme={{ algorithm: isDark ? theme.darkAlgorithm : theme.defaultAlgorithm }}>
        {children}
      </ConfigProvider>
    </AppContext.Provider>
  );
}

function useApp() {
  return useContext(AppContext);
}
  Object.assign(__export, { AppProvider, useApp });
})();

// ---- Lucide (offline fallback, table injected at build time) ----
const ICONS = typeof LUCIDE !== "undefined" ? LUCIDE : {};

function camelToKebab(s) {
  return s.replace(/([a-z0-9])([A-Z])/g, "$1-$2").toLowerCase();
}

function lookupIcon(name) {
  if (!name) return null;
  return (
    ICONS[name] ||
    ICONS[camelToKebab(name)] ||
    ICONS[name.replace(/-([a-z])/g, (_m, c) => c.toUpperCase())] ||
    null
  );
}

// ---- icon-plus (联通) online flow, same as packages/previewpc ----
const ICON_API_BASE = "https://octo.hdesign.huawei.com";
const GET_CONFIG = `${ICON_API_BASE}/assetRepository/iconPlus/getConfig`;
const GET_ICON_INFO = `${ICON_API_BASE}/assetRepository/iconPlus/getIconInfo`;
const GET_ICON = `${ICON_API_BASE}/assetRepository/iconPlus/getIcon`;

let plusState = null; // null = probing, true = icon-plus available, false = fall back to Lucide
let plusPromise = null; // singleton getConfig probe promise
let iconConfig = null;
let defaultColorId = "";
const iconInfoMap = {}; // name -> { name, url }
const svgCache = new Map(); // "name&variant&color" -> svg text

// variant prop -> getConfig style key (matches previewpc's shapeToStyleKey)
const STYLE_KEY = {
  lined: "border",
  filled: "filled",
  "two-tone": "two_colors1",
  circle: "round_bottom2",
  square: "square_bottom2",
};

function getStyleValue(styleKey) {
  return iconConfig?.style?.find((s) => s.key === styleKey)?.value || styleKey;
}

// resolve an API color id from the requested hex against getConfig colors
function resolveColorId(variant, colorHex) {
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colors = (iconConfig?.colors || []).filter((c) => c.style === styleValue);
  if (colorHex) {
    const m = colors.find((c) =>
      c.value.split(",").map((v) => v.trim()).includes(colorHex)
    );
    if (m) return m.id;
  }
  return defaultColorId || colors[0]?.id || "";
}

// getConfig probe == 联通可用性验证 (same as previewpc fetchIconConfig)
function ensurePlus() {
  if (plusPromise) return plusPromise;
  plusPromise = (async () => {
    try {
      const resp = await fetch(GET_CONFIG);
      if (!resp.ok) {
        plusState = false;
        return false;
      }
      iconConfig = await resp.json();
      const linear = iconConfig.colors?.find(
        (c) => c.type === "linear" || c.type === "通用色"
      );
      defaultColorId =
        linear?.id || iconConfig.colors?.[0]?.id || "";
      plusState = true;
      return true;
    } catch (e) {
      plusState = false;
      return false;
    }
  })();
  return plusPromise;
}

// pick the best icon-plus match for a keyword (prefer system-icon group, then name contains keyword, else first)
function selectBestIcon(icons, keyword) {
  return (
    icons.find(
      (i) => Array.isArray(i.group) && i.group.some((g) => g.includes("系统图标"))
    ) ||
    icons.find((i) => i.name?.toLowerCase().includes(keyword.toLowerCase())) ||
    icons[0]
  );
}

// name -> { name, url } via getIconInfo (cached in iconInfoMap)
async function resolveIconInfo(name) {
  if (iconInfoMap[name]) return iconInfoMap[name];
  try {
    const resp = await fetch(
      `${GET_ICON_INFO}?keyword=${encodeURIComponent(name)}&topK=2&source_id=6`
    );
    const data = await resp.json(); // [{ keyword, icons: [{ icon_id, name, category, group[], url }] }]
    const entry = (Array.isArray(data) ? data : [data]).find(
      (d) => d.icons?.length
    );
    const selected = selectBestIcon(entry?.icons || [], name);
    if (!selected?.url) return null;
    iconInfoMap[name] = { name: selected.name, url: selected.url };
    return iconInfoMap[name];
  } catch (e) {
    return null;
  }
}

// fetch the SVG text for a name via getIcon (url + size + variant + colorId + fileType=svg)
async function fetchSvg(name, variant, colorHex) {
  const info = await resolveIconInfo(name);
  if (!info) return "";
  const styleValue = getStyleValue(STYLE_KEY[variant] || "border");
  const colorId = resolveColorId(variant, colorHex);
  try {
    const resp = await fetch(
      `${GET_ICON}?url=${encodeURIComponent(info.url)}&size=16&style=${encodeURIComponent(
        styleValue
      )}&color=${encodeURIComponent(colorId)}&fileType=svg`
    );
    const data = await resp.json(); // { url, name, data } or array
    const item = Array.isArray(data) ? data[0] : data;
    return item?.data || ""; // raw SVG text, injected as-is
  } catch (e) {
    return "";
  }
}

function Icon({
  name,
  src,
  size = 16,
  color,
  className = "",
  style,
  strokeWidth = 2,
  variant = "lined",
}) {
  const [plus, setPlus] = useState(plusState); // reuse already-probed result
  const [svg, setSvg] = useState(
    () => svgCache.get(`${name}&${variant}&${color}`) || ""
  );

  useEffect(() => {
    if (src) return; // user-asset mode: no network needed
    let alive = true;
    ensurePlus().then((ok) => {
      if (!alive) return;
      setPlus(ok);
      if (!ok) return; // getConfig probe failed → Lucide branch
      const key = `${name}&${variant}&${color}`;
      if (svgCache.has(key)) {
        setSvg(svgCache.get(key));
        return;
      }
      fetchSvg(name, variant, color).then((s) => {
        if (!alive) return;
        svgCache.set(key, s);
        setSvg(s);
      });
    });
    return () => {
      alive = false;
    };
  }, [src, name, variant, color]);

  // user-provided asset (svg/png/jpg) via relative path — overrides name when both are set
  if (src) {
    return React.createElement("img", {
      src: src,
      width: size,
      height: size,
      className: className,
      alt: "",
      "aria-hidden": true,
      style: { ...style, display: "inline-block", verticalAlign: "middle" },
    });
  }

  // probe not finished yet → render nothing
  if (plus === null) return null;

  // icon-plus unavailable (offline) → Lucide fallback (original behavior)
  if (plus === false) {
    const nodes = lookupIcon(name);
    if (!nodes) return null;
    return React.createElement(
      "svg",
      {
        xmlns: "http://www.w3.org/2000/svg",
        width: size,
        height: size,
        viewBox: "0 0 24 24",
        fill: "none",
        strokeWidth: strokeWidth,
        strokeLinecap: "round",
        strokeLinejoin: "round",
        className: className,
        "aria-hidden": true,
        style: { ...style, stroke: color || "currentColor" },
      },
      nodes.map(([tag, attrs], i) =>
        React.createElement(tag, { key: i, ...attrs })
      )
    );
  }

  // icon-plus available → render fetched SVG text as-is (only width/height on the wrapper)
  if (!svg) {
    return React.createElement("span", {
      className,
      "aria-hidden": true,
      style: { ...style, width: size, height: size },
    });
  }
  
  return React.createElement("span", {
    className,
    "aria-hidden": true,
    style: { ...style, width: size, height: size },
    dangerouslySetInnerHTML: { __html: svg },
  });
}
  Object.assign(__export, { Icon });
})();

          name="host"
          label="通信地址"
          rules={[
            { required: true, message: "请输入通信地址" },
            { pattern: /^(?=.{1,255}$)[a-zA-Z0-9.-]+$/, message: "仅支持域名或 IP 格式" },
          ]}
        >
          <Input placeholder="如:192.168.10.21" allowClear />
        </Form.Item>
        <Form.Item
          name="port"
          label="端口"
          rules={[{ required: true, message: "请输入端口" }]}
        >
          <InputNumber min={1} max={65535} placeholder="502" style={{ width: "100%" }} />
        </Form.Item>
      </div>

      <Form.Item
        name="collectInterval"
        label="采集周期(秒)"
        rules={[{ required: true, message: "请输入采集周期" }]}
        extra="数据点位的轮询间隔,范围 5 ~ 3600 秒"
      >
        <InputNumber min={5} max={3600} placeholder="15" style={{ width: "100%" }} />
      </Form.Item>

      <Form.Item name="encrypted" label="链路加密" valuePropName="checked">
        <Switch />
      </Form.Item>
    </Form>
  );
}
  Object.assign(__export, { NetworkForm });
})();

/* ===== src/views/steps/ConfirmForm.jsx ===== */
(function () {
  const { Descriptions, Alert } = antd;
  const { confirmGroups, labelMaps } = __export;
// Layer 4: 步骤三 — 确认提交(只读回显,不做输入)
function displayValue(key, value) {
  if (value === undefined || value === null || value === "") return "—";
  const map = labelMaps[key];
  return map ? map[String(value)] : String(value);
}

function ConfirmForm({ values }) {
  return (
    <div className="step-form">
      <Alert
        type="info"
        showIcon
        message="请核对以下配置信息,提交后设备将进入接入调试队列"
        className="confirm-alert"
      />
      {confirmGroups.map((group) => (
        <Descriptions
          key={group.key}
          title={group.title}
          bordered
          size="small"
          column={2}
          className="confirm-group"
        >
          {group.fields.map(([key, label]) => (
            <Descriptions.Item key={key} label={label}>
              {displayValue(key, values[key])}
            </Descriptions.Item>
          ))}
        </Descriptions>
      ))}
    </div>
  );
}
  Object.assign(__export, { ConfirmForm });
})();

/* ===== src/views/StepFlow.jsx ===== */
(function () {
  const { useState } = React;
  const { Form, Steps, Button, Space, Result } = antd;
  const { Icon, stepItems } = __export;
  const BasicInfoForm = __export.BasicInfoForm;
  const NetworkForm = __export.NetworkForm;
  const ConfirmForm = __export.ConfirmForm;
const { useForm } = Form;

// Layer 4: 步骤流编排 — 步骤条 + 当前步骤表单 + 底部操作按钮
function StepFlow() {
  const [current, setCurrent] = useState(0);
  const [submitted, setSubmitted] = useState(false);
  const [allValues, setAllValues] = useState({});
  const [basicForm] = useForm();
  const [networkForm] = useForm();

  const isLast = current === stepItems.length - 1;

  // 表单实例与已收集数据按步骤分派(确认页只读回显)
  const forms = [basicForm, networkForm, null];
  const stepInitialValues = [allValues.basic, allValues.network, undefined];

  async function goNext() {
    const form = forms[current];
    if (form) {
      try {
        const values = await form.validateFields();
        setAllValues((prev) => ({
          ...prev,
          [stepItems[current].key]: values,
        }));
      } catch {
        return; // 校验失败停留在当前步
      }
    }
    if (isLast) {
      setSubmitted(true);
    } else {
      setCurrent((c) => c + 1);
    }
  }

  function goPrev() {
    setCurrent((c) => Math.max(0, c - 1));
  }

  function restart() {
    setSubmitted(false);
    setCurrent(0);
    setAllValues({});
    basicForm.resetFields();
    networkForm.resetFields();
  }

  if (submitted) {
    return (
      <section className="panel step-panel">
        <Result
          status="success"
          title="设备接入任务已提交"
          subTitle={`设备「${allValues.basic?.deviceName || "未命名"}」已进入接入调试队列,预计 2 分钟内完成首轮采集`}
          extra={
            <Button type="primary" onClick={restart} icon={<Icon name="rotate-ccw" size={14} />}>
              再配置一台
            </Button>
          }
        />
      </section>
    );
  }

  return (
    <section className="panel step-panel">
      <Steps current={current} items={stepItems} />

      <div className="step-content">
        {current === 0 && (
          <BasicInfoForm form={basicForm} initialValues={stepInitialValues[0]} />
        )}
        {current === 1 && (
          <NetworkForm form={networkForm} initialValues={stepInitialValues[1]} />
        )}
        {current === 2 && <ConfirmForm values={{ ...allValues.basic, ...allValues.network }} />}
      </div>

      <div className="step-footer">
        <Space>
          <Button onClick={goPrev} disabled={current === 0} icon={<Icon name="arrow-left" size={14} />}>
            上一步
          </Button>
          <Button type="primary" onClick={goNext}>
            {isLast ? (
              "提交配置"
            ) : (
              <>
                下一步 <Icon name="arrow-right" size={14} />
              </>
            )}
          </Button>
        </Space>
      </div>
    </section>
  );
}
  Object.assign(__export, { StepFlow });
})();
