<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICT Component Preview — BottomNav</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="./assets/icons.js"></script>
    <link rel="stylesheet" href="./assets/tokens.css" />
    <link rel="stylesheet" href="./components/BottomNav/index.css" />
    <style>
      body { margin: 0; font-family: "HarmonyOS Sans", "Microsoft YaHei", Arial, "PingFang SC", sans-serif; background-color: #f3f3f3; color: #191919; }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="root">Loading...</div>
    <script type="text/babel" data-presets="react" src="./components/BottomNav/index.jsx"></script>
    <script type="text/babel" data-presets="react">
      function tryRender() {
        if (typeof BottomNav !== "undefined") {
          const root = ReactDOM.createRoot(document.getElementById("root"));
          root.render(React.createElement(BottomNav));
        } else {
          setTimeout(tryRender, 50);
        }
      }
      tryRender();
    </script>
  </body>
</html>
